# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Runs Snyk Code (SAST) and Snyk Open Source (SCA) on every push and pull request to master.
# Snyk Code results are uploaded to GitHub Code Scanning; Open Source results go to Snyk.
#
# Requires the repository secret SNYK_TOKEN (and the same secret under Dependabot secrets so
# Dependabot PRs can run it), and Snyk Code enabled for the Snyk organization.
# CLI reference: https://docs.snyk.io/snyk-cli/cli-reference

name: Snyk Security

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  snyk:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Snyk CLI
        uses: snyk/actions/setup@806182742461562b67788a64410098c9d9b96adb

      # Snyk Code (SAST): prints findings to the log and writes SARIF for GitHub.
      # Add `|| true` to not fail the pipeline on findings.
      - name: Snyk Code test
        run: snyk code test --sarif-file-output=snyk-code.sarif

      # Snyk does not read uv.lock, so export the locked runtime dependencies to a
      # requirements.txt and install them; Snyk resolves Python dependencies from the environment.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Export locked dependencies
        run: |
          uv export --no-dev --no-hashes --no-emit-project -o requirements.txt
          pip install -r requirements.txt

      # Snyk Open Source (SCA): uploads the dependency snapshot to Snyk.
      - name: Snyk Open Source monitor
        run: snyk monitor --file=requirements.txt --package-manager=pip

      # Upload even when the scan found issues, as long as a SARIF file was written.
      - name: Upload result to GitHub Code Scanning
        if: always() && hashFiles('snyk-code.sarif') != ''
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          sarif_file: snyk-code.sarif
