# Dependabot version updates (security alerts work without this file; this adds
# scheduled PRs that keep dependencies current so alerts have less to catch).
# See https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      # One PR for all routine bumps instead of one per package.
      minor-and-patch:
        update-types:
          - minor
          - patch
      # Security fixes grouped the same way, kept apart from routine bumps.
      security:
        applies-to: security-updates
        patterns:
          - "*"
